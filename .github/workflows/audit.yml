name: Security baseline CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Audit a configured Cloudflare zone'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Audit secure fixture
        run: PYTHONPATH=src python -m cfguard --fixture fixtures/secure.json --report report.md
      - name: Generate the complete demo evidence
        run: PYTHONPATH=src python -m cfguard.demo --output demo-reports
      - name: Check committed evidence
        run: diff -ru evidence demo-reports
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: portfolio-demo-reports
          path: demo-reports/

  # Live audit is opt-in and requires repository secrets CF_ZONE_ID and CF_API_TOKEN.
  live-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit Cloudflare zone
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: PYTHONPATH=src python -m cfguard --zone-id "$CF_ZONE_ID" --report live-report.md
      - name: Audit live DDoS posture
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: PYTHONPATH=src python -m cfguard.live --zone-id "$CF_ZONE_ID" --report live-ddos-report.md
